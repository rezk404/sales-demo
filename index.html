<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sales Pipeline</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <!-- CRM sidebar (icons are injected from app.js via data-icon) -->
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sb-head">
        <span class="sb-logo">R</span>
        <span class="sb-brand">Realty CRM</span>
        <span class="sb-caret" data-icon="chevronDown"></span>
      </div>
      <nav class="sb-nav">
        <a class="sb-item" href="#" data-nav="Dashboard" title="Dashboard"><span class="sb-icon" data-icon="home"></span><span class="sb-label">Dashboard</span></a>
        <div class="sb-group is-open is-active" id="sbLeadsGroup">
          <button type="button" class="sb-item" id="sbLeads" aria-expanded="true" title="Leads">
            <span class="sb-icon" data-icon="users"></span><span class="sb-label">Leads</span><span class="sb-arrow" data-icon="chevronDown"></span>
          </button>
          <div class="sb-sub">
            <a class="sb-subitem2" href="#fresh" data-section="fresh">Fresh<span class="sb-count" id="sbFreshCount"></span></a>
            <a class="sb-subitem2" href="#cold" data-section="cold">Cold<span class="sb-count" id="sbColdCount"></span></a>
          </div>
        </div>
        <a class="sb-item" href="#" data-nav="Clients" title="Clients"><span class="sb-icon" data-icon="user"></span><span class="sb-label">Clients</span></a>
        <a class="sb-item" href="#" data-nav="Projects" title="Projects"><span class="sb-icon" data-icon="building"></span><span class="sb-label">Projects</span></a>
        <a class="sb-item" href="#" data-nav="Finance" title="Finance"><span class="sb-icon" data-icon="dollar"></span><span class="sb-label">Finance</span></a>
        <a class="sb-item" href="#" data-nav="Tickets" title="Tickets"><span class="sb-icon" data-icon="headphones"></span><span class="sb-label">Tickets</span></a>
        <a class="sb-item" href="#" data-nav="Events" title="Events"><span class="sb-icon" data-icon="calendar"></span><span class="sb-label">Events</span></a>
        <a class="sb-item" href="#" data-nav="Messages" title="Messages"><span class="sb-icon" data-icon="message"></span><span class="sb-label">Messages</span></a>
        <a class="sb-item" href="#" data-nav="Reports" title="Reports"><span class="sb-icon" data-icon="barChart"></span><span class="sb-label">Reports</span></a>
        <a class="sb-item" href="#" data-nav="Settings" title="Settings"><span class="sb-icon" data-icon="settings"></span><span class="sb-label">Settings</span></a>
      </nav>
      <button type="button" class="sb-toggle" id="sbToggle" title="Collapse menu" aria-label="Collapse menu"><span data-icon="chevronLeft"></span></button>
    </aside>
    <div class="sb-overlay" id="sbOverlay"></div>

    <div class="main">
      <!-- Page header -->
      <header class="topbar">
        <button type="button" class="top-icon menu-btn" id="menuBtn" title="Menu" aria-label="Open menu" data-icon="menu"></button>
        <div class="topbar-title">
          <h1>Leads</h1>
          <nav class="crumbs" aria-label="Breadcrumb">
            <a href="#">Home</a><span>•</span><a href="#">Leads</a><span>•</span><span aria-current="page" id="crumbSection">Fresh</span>
          </nav>
        </div>
        <div class="topbar-actions" id="topbarActions">
          <button class="top-icon" type="button" id="topSearchBtn" title="Search" data-icon="search"></button>
          <button class="top-icon" type="button" id="topAddBtn" title="Add lead" data-icon="plusCircle"></button>
          <button class="top-icon has-badge" type="button" title="Notifications" data-icon="bell"><span class="top-badge">12</span></button>
          <button class="top-icon" type="button" title="Log out" data-icon="power"></button>
        </div>
      </header>

      <!-- Fresh / Cold -->
      <div class="section-tabs" role="tablist" aria-label="Lead views">
        <button type="button" role="tab" class="sec-tab" id="tabFresh" data-section="fresh" aria-selected="true">
          Fresh<span class="sec-count" id="tabFreshCount"></span>
        </button>
        <button type="button" role="tab" class="sec-tab" id="tabCold" data-section="cold" aria-selected="false">
          Cold<span class="sec-count" id="tabColdCount"></span>
        </button>
        <span class="sec-caption" id="sectionCaption"></span>
      </div>

      <!-- Filter bar -->
      <div class="filterbar" id="filterbar" role="toolbar" aria-label="Filters">        <div class="fb-item" data-cold-only><span class="fb-label" id="lblPipeline">Pipeline</span><div id="pipelineSelect"></div></div>
        <div class="fb-item" data-cold-only><span class="fb-label" id="lblProject">Project</span><div id="projectSelect"></div></div>
        <div class="fb-item" data-cold-only><span class="fb-label" id="lblAgent">Agent</span><div id="agentSelect"></div></div>

        <div class="fb-search">
          <span class="fb-search-icon" data-icon="search"></span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Start typing to search" aria-label="Search leads">
          <button type="button" class="fb-search-clear" id="searchClear" title="Clear search" data-icon="x" hidden></button>        <div class="fb-filters" data-cold-only><button type="button" class="fb-filters-btn" id="filtersBtn"><span data-icon="filter"></span>Filters<span class="fb-filters-count" id="filtersCount" hidden>0</span></button></div>

        </div>
      </div>

      <!-- Actions -->
      <div class="actionbar">
        <button type="button" class="btn btn-primary" id="addLeadBtn"><span data-icon="plus"></span>Add Lead</button>
        <div class="view-toggle" id="viewToggle" role="group" aria-label="View">
          <button type="button" class="vt-btn" data-view="list" title="List view" aria-pressed="false" data-icon="list"></button>
          <button type="button" class="vt-btn" data-view="kanban" title="Kanban view" aria-pressed="true" data-icon="kanban"></button>
        </div>
      </div>

      <div class="active-filters" id="activeFilters" hidden></div>

      <main class="workspace">
        <div class="board" id="board" aria-label="Cold sales pipeline" hidden></div>
        <div class="list-wrap" id="listView"></div>
      </main>
    </div>
  </div>

  <!-- One centered modal: lead creation, Fresh lead editing, Cold lead update -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
